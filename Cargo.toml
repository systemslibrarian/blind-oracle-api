[package]
name = "blind-oracle-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A blind FHE oracle: computes homomorphic addition on TFHE ciphertexts it can never decrypt."
authors = ["Paul Clark"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/systemslibrarian/crypto-lab-blind-oracle-api"
keywords = ["fhe", "tfhe", "cryptography", "privacy", "post-quantum"]
categories = ["cryptography", "web-programming::http-server"]

[dependencies]
tfhe = { version = "0.8", features = ["integer", "x86_64-unix"] }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"

[profile.release]
# FHE workloads are CPU-bound; optimize aggressively for the deployed binary.
lto = "thin"
codegen-units = 1
